services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_IDLE_SECONDS: 120
      PREVIEW_TARGET_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
