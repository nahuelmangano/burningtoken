<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Una pequeña página dedicada a Lionel Messi." />
    <title>Hola mundo | Messi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <section class="card" aria-labelledby="title">
        <div class="copy">
          <p class="eyebrow">Bienvenido</p>
          <h1 id="title">Hola mundo <span>👋</span></h1>
          <p class="lead">Una web simple para saludar y celebrar al mejor jugador argentino.</p>
          <p class="signature">Vamos, Messi 🇦🇷</p>
        </div>

        <figure class="portrait">
          <img
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Lionel%20Messi.jpg?width=1200"
            alt="Lionel Messi durante un partido con el Barcelona"
          />
          <figcaption>
            Foto: <a href="https://commons.wikimedia.org/wiki/File:Lionel_Messi.jpg" target="_blank" rel="noreferrer">Wonker / Wikimedia Commons</a>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
